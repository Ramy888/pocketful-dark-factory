# The seats, and what each one actually runs. One source of truth: create-seats launches
# from this, each mandate's `Harness:` and `Model:` lines must match its row, and a test
# fails if they ever disagree. Edit here, then update the mandates the test names.
#
# role|harness|model|runtime
#   runtime `jam`      a Band-owned seat, created by create-seats
#   runtime `adapter`  a seat this machine runs itself and attaches, because Band has no
#                      owned-runtime transport for it. create-seats prepares its worktree
#                      and identity and leaves the process to the launcher.
#
# Three model families, one per seat, so no two seats share a blind spot. Chosen on
# evidence, not reputation: each was given a spec with an off-by-one against it and asked
# for a verdict. All three found it; the rows record which one did it best.
coordinator|OpenCode|moonshotai/Kimi-K2.5|adapter
implementer|OpenCode|MiniMaxAI/MiniMax-M2.5|adapter
verifier|OpenCode|zai-org/GLM-5.3|adapter
