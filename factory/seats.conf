# The seats, and what each one actually runs. One source of truth: create-seats launches
# from this, each mandate's `Harness:` and `Model:` lines must match its row, and a test
# fails if they ever disagree. Edit here, then update the mandates the test names.
#
# role|harness|model|runtime|name
#   runtime `jam`      a Band-owned seat, created by create-seats. Band supervises it, the
#                      mandate is live-linked as its owner instructions, and the watchdog can
#                      restart it.
#   runtime `adapter`  a seat this machine runs itself and attaches, for a runtime Band has
#                      no transport for. create-seats prepares its worktree and identity and
#                      leaves the process to run-seat.
#   name               the seat's display name, and therefore the filename its mandate ships
#                      under: a grader matches every seat in the room to a mandate named after
#                      it. Names are unique per account and cannot be deleted or renamed, so a
#                      name a run takes is spent. These deliberately say nothing about the
#                      problem — a mandate called after the track would fail the test the
#                      mandates are written to pass, whatever the scan says.
#
# Back on the runtime that is paid for and proven. An open-weights roster was measured first,
# on the practice track: it built all four stages and passed every check, and it cost $24.53 to
# do it on a shared counter. The graded problem is a different order of work, so the arithmetic
# decided this, not the quality. That rehearsal is written up in band-work/evidence/.
#
# Two seats share a family here, which is a real loss: the verifier no longer checks work from
# outside the blind spots of the seat that built it. It is a loss taken deliberately, because a
# run that cannot afford to finish scores nothing at all.
coordinator|Claude Code|claude-opus-5|jam|factory-coordinator
implementer|Claude Code|claude-sonnet-5|jam|factory-implementer
verifier|Claude Code|claude-opus-5|jam|factory-verifier
